<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lu 的个人作品集 — Planet LL" />
    <title>Luu · 个人作品集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      href="static/fonts/HYPixel9pxJ-2.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-home">
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header class="site-header site-header--planet" id="top">
      <div class="header-inner header-inner--planet">
        <a class="header-logo" href="index.html#home" aria-label="返回首页" id="header-logo">
          <span class="header-logo-visual">
            <img
              class="header-logo-idle"
              src="static/logo/logo-idle.png"
              alt=""
              width="72"
              height="72"
              decoding="async"
            />
            <span class="header-logo-live" aria-hidden="true">
              <img
                class="header-logo-circle"
                src="static/logo/logo-circle.png"
                alt=""
                width="72"
                height="72"
                decoding="async"
              />
              <img
                class="header-logo-leg header-logo-leg--left"
                src="static/logo/logo-left-leg.png"
                alt=""
                width="72"
                height="72"
                decoding="async"
              />
              <img
                class="header-logo-leg header-logo-leg--right"
                src="static/logo/logo-right-leg.png"
                alt=""
                width="72"
                height="72"
                decoding="async"
              />
            </span>
          </span>
        </a>

        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
        >
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="sr-only">打开菜单</span>
        </button>

        <nav class="site-nav site-nav--planet" id="site-nav" aria-label="主导航">
          <ul class="nav-list nav-list--planet">
            <li>
              <a
                class="nav-link nav-link--planet"
                href="#planet-projects"
                data-nav="work"
                >工作项目</a
              >
            </li>
            <li class="nav-item nav-item--creative">
              <button
                type="button"
                class="nav-link nav-link--planet nav-link--creative"
                id="nav-creative-trigger"
                aria-expanded="false"
                aria-controls="nav-creative-popover"
                data-nav="creative"
              >
                脑洞大开
              </button>
              <div
                class="nav-creative-popover"
                id="nav-creative-popover"
                role="tooltip"
                aria-hidden="true"
                aria-label="暂时还没开完"
              >
                <img
                  class="nav-creative-popover-art"
                  src="static/home/nav-bubble-group.png"
                  alt=""
                  width="192"
                  height="109"
                  decoding="async"
                />
              </div>
            </li>
            <li>
              <button
                type="button"
                class="nav-link nav-link--planet nav-link--resume"
                data-nav="resume"
              >
                我的简历
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="planet-hero" id="home" aria-labelledby="planet-hero-title">
        <div class="planet-hero-sky" aria-hidden="true">
          <div class="planet-hero-sky-flip">
            <img src="static/home/hero-bg-milky-way.jpg" alt="" decoding="async" />
          </div>
        </div>
        <div class="planet-hero-meteor" aria-hidden="true">
          <img src="static/home/hero-meteor-strip.jpg" alt="" decoding="async" />
        </div>

        <div class="planet-hero-stage">
          <img
            class="planet-hero-collage"
            src="static/home/hero-collage-main.png"
            alt=""
            width="1160"
            height="916"
            decoding="async"
          />

          <div class="planet-hero-copy">
            <h1 id="planet-hero-title" class="planet-hero-title">Hi，I'm Luu</h1>
            <p class="planet-hero-sub">Welcome to Planet LL</p>
          </div>
        </div>
      </section>

      <section
        class="planet-projects"
        id="planet-projects"
        aria-label="工作项目"
      >
        <div class="planet-projects-card">
          <article class="planet-row planet-row--link">
            <a
              class="planet-row-hit"
              href="case-aigc-showcase.html"
              aria-label="Novate｜AIGC短视频创作平台 — 查看案例"
            ></a>
            <div class="planet-row-inner">
              <div class="planet-index" aria-hidden="true">
                <img
                  class="planet-index-bg"
                  src="static/home/planet-01-bg.png"
                  alt=""
                  width="148"
                  height="148"
                  decoding="async"
                />
                <span class="planet-index-num">01</span>
              </div>
              <div class="planet-row-body">
                <div class="planet-row-head">
                  <h2 class="planet-row-title">Novate｜AIGC短视频创作平台</h2>
                  <div class="planet-tags">
                    <span class="planet-tag">PC端</span>
                    <span class="planet-tag">0-1设计</span>
                    <span class="planet-tag">AI设计</span>
                  </div>
                </div>
                <p class="planet-row-desc">
                  芒果TV自研的低门槛、易操作的AI视频创作平台
                </p>
              </div>
              <div class="planet-row-arrow">
                <img src="static/home/arrow-aigc.svg" alt="" width="90" height="90" decoding="async" />
              </div>
            </div>
          </article>

          <hr class="planet-divider-line" aria-hidden="true" />

          <article class="planet-row planet-row--link">
            <a
              class="planet-row-hit"
              href="case-dash-showcase.html"
              aria-label="智慧运营平台｜仪表盘改版 — 查看案例"
            ></a>
            <div class="planet-row-inner">
              <div class="planet-index" aria-hidden="true">
                <img
                  class="planet-index-bg"
                  src="static/home/planet-02-bg.png"
                  alt=""
                  width="148"
                  height="148"
                  decoding="async"
                />
                <span class="planet-index-num">02</span>
              </div>
              <div class="planet-row-body">
                <div class="planet-row-head">
                  <h2 class="planet-row-title">智慧运营平台｜仪表盘改版</h2>
                  <div class="planet-tags">
                    <span class="planet-tag">PC端</span>
                    <span class="planet-tag">交互优化</span>
                    <span class="planet-tag">视觉设计</span>
                  </div>
                </div>
                <p class="planet-row-desc">
                  智慧运营平台是芒果TV内部使用的数据分析平台，主要包含sql分析、图表绘制、仪表盘等模块
                </p>
              </div>
              <div class="planet-row-arrow">
                <img src="static/home/arrow-dash.svg" alt="" width="90" height="90" decoding="async" />
              </div>
            </div>
          </article>

          <hr class="planet-divider-line" aria-hidden="true" />

          <article class="planet-row planet-row--static">
            <div class="planet-row-inner">
              <div class="planet-index" aria-hidden="true">
                <img
                  class="planet-index-bg"
                  src="static/home/planet-03-bg.png"
                  alt=""
                  width="148"
                  height="148"
                  decoding="async"
                />
                <span class="planet-index-num">03</span>
              </div>
              <div class="planet-row-body">
                <div class="planet-row-head">
                  <h2 class="planet-row-title">川流｜快讯模块设计</h2>
                  <div class="planet-tags">
                    <span class="planet-tag">移动端</span>
                    <span class="planet-tag">创新设计</span>
                  </div>
                </div>
                <p class="planet-row-desc">
                  川流是芒果TV内部协同办公平台“在芒”中的新闻快讯小程序
                </p>
              </div>
              <div class="planet-row-arrow planet-row-arrow--muted">
                <img src="static/home/arrow-chuanliu.svg" alt="" width="90" height="90" decoding="async" />
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>

    <script src="main.js" defer></script>
  </body>
</html>
