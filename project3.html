<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>川流｜快讯模块设计 · Luu</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="case-long-page">
    <a class="skip-link" href="#case-long-main">跳到主要内容</a>
    <main id="case-long-main" class="case-long-frame" role="main">
      <div class="case-long-image-wrap">
        <a
          class="header-logo case-long-logo"
          href="index.html#zpj-projects"
          aria-label="返回首页作品区"
          id="case-long-logo"
        >
          <span class="header-logo-visual">
            <img
              class="header-logo-idle"
              src="static/logo/logo-idle.png"
              alt=""
              width="72"
              height="72"
              decoding="async"
            />
            <span class="header-logo-live" aria-hidden="true">
              <img
                class="header-logo-circle"
                src="static/logo/logo-circle.png"
                alt=""
                width="72"
                height="72"
                decoding="async"
              />
              <img
                class="header-logo-leg header-logo-leg--left"
                src="static/logo/logo-left-leg.png"
                alt=""
                width="72"
                height="72"
                decoding="async"
              />
              <img
                class="header-logo-leg header-logo-leg--right"
                src="static/logo/logo-right-leg.png"
                alt=""
                width="72"
                height="72"
                decoding="async"
              />
            </span>
          </span>
        </a>
        <img
          class="case-long-img"
          src="static/project3.png"
          srcset="static/project3.png 2880w"
          sizes="1440px"
          alt="川流｜快讯模块设计案例长图"
          width="2880"
          height="8704"
          decoding="async"
          fetchpriority="high"
        />
      </div>
    </main>
    <script src="main.js" defer></script>
  </body>
</html>
